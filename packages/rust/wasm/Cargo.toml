[package]
name = "epaper-dithering-wasm"
# No version: this crate is never published. The npm package's version is package.json's.
publish = false
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epaper-dithering-core = { path = "../core" }
wasm-bindgen = "0.2"
