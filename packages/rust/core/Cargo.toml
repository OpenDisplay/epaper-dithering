[package]
name = "epaper-dithering-core"
version = "7.0.0"
edition = "2024"
description = "High-quality dithering algorithms for e-paper / e-ink displays — OKLab color matching, error diffusion, ordered dithering, measured palettes"
license = "MIT"
repository = "https://github.com/OpenDisplay/epaper-dithering"
homepage = "https://opendisplay.org"
documentation = "https://docs.rs/epaper-dithering-core"
keywords = ["epaper", "eink", "dithering", "color", "embedded"]
categories = ["graphics", "multimedia::images", "embedded"]
readme = "README.md"
# tests/ needs the fixtures and the repository's example palettes, so none of it is packaged;
# the unit tests in src/ are self-contained and run from the published crate.
exclude = ["tests/", "examples/"]

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "dithering"
harness = false

[dev-dependencies]
approx = "0.5"  # float comparisons in tests: assert_relative_eq!
criterion = { version = "0.8", features = ["html_reports"] }
image = "0.25"  # image loading/saving for examples
