[package]
name = "epaper-dithering"
# No version: this crate is never published. The wheel's version is pyproject.toml's.
publish = false
edition = "2024"

[lib]
name = "epaper_dithering_rs"
crate-type = ["cdylib"]

[dependencies]
epaper-dithering-core = { path = "../rust/core" }
pyo3 = { version = "0.30", features = ["extension-module"] }
