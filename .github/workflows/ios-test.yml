name: iOS Wrapper Tests

# The `ios` crate is workspace-excluded (so it never breaks the Linux `cargo test --workspace`
# in rust-test.yml), so it needs its own job. These tests build the C-ABI FFI for the HOST
# target and exercise it — no Xcode and no Apple iOS targets required. The `xcframework` job
# runs the real macOS/Xcode build (build-xcframework.sh) so a broken build shows up here, not
# only when release.yml builds the release artifact.

on:
  push:
    branches: [main]
    paths:
      - 'packages/rust/ios/**'
      - 'packages/rust/core/**'
      - '.github/workflows/ios-test.yml'
  pull_request:
    paths:
      - 'packages/rust/ios/**'
      - 'packages/rust/core/**'
      - '.github/workflows/ios-test.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/rust/ios

jobs:
  test:
    name: Test (host FFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust/ios

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  xcframework:
    name: Build XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust/ios

      - name: Build
        working-directory: packages/rust/ios
        run: ./build-xcframework.sh

      - name: Check exported symbols
        working-directory: packages/rust/ios
        run: |
          for sym in _ed_dither _ed_dither_options_default _ed_dither_options_default_dbs_passes _ed_abi_version; do
            nm -gU EpaperDithering.xcframework/ios-arm64/libepaper_dithering_ios.a | grep -q " T ${sym}$" \
              || { echo "missing export ${sym}"; exit 1; }
          done
