name: iOS Wrapper Tests

# The `ios` crate is workspace-excluded (so it never breaks the Linux `cargo test --workspace`
# in rust-test.yml), so it needs its own job. These tests build the C-ABI FFI for the HOST
# target and exercise it — no Xcode and no Apple iOS targets required. The `xcframework` job
# runs the real macOS/Xcode build (build-xcframework.sh) so a broken build shows up here, not
# only when release.yml builds the release artifact.

on:
  push:
    branches: [main]
    paths:
      - 'packages/rust/ios/**'
      - 'packages/rust/core/**'
      - '.github/workflows/ios-test.yml'
  pull_request:
    paths:
      - 'packages/rust/ios/**'
      - 'packages/rust/core/**'
      - '.github/workflows/ios-test.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/rust/ios

jobs:
  test:
    name: Test (host FFI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust/ios

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  xcframework:
    name: Build XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust/ios

      # The runner's default Xcode can be older than the LLVM that rustc emits; its `strip` then
      # silently leaves most of the archive (std, compiler_builtins) unstripped (~14 MB instead
      # of ~2.4 MB for the device slice). Use the newest stable Xcode on the image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          rustc --version

      - name: Build
        working-directory: packages/rust/ios
        run: ./build-xcframework.sh

      # Guard against an unstripped archive: see the setup-xcode comment above.
      - name: Check device slice size
        working-directory: packages/rust/ios
        run: |
          size=$(stat -f%z EpaperDithering.xcframework/ios-arm64/libepaper_dithering_ios.a)
          echo "ios-arm64 static library: ${size} bytes"
          [ "$size" -le 6000000 ] || { echo "::error::device slice is ${size} bytes; strip probably failed (expected ~2.4 MB)"; exit 1; }

      # Link (not nm): rustc's embedded LLVM bitcode can be newer than the runner's Xcode
      # understands, which breaks nm but not the linker — and linking is what the app does.
      - name: Link check against the device slice
        working-directory: packages/rust/ios
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 \
            -I EpaperDithering.xcframework/ios-arm64/Headers ci/link_check.c \
            EpaperDithering.xcframework/ios-arm64/libepaper_dithering_ios.a -o "$RUNNER_TEMP/link_check"

  probe-rust:  # TEMPORARY: which rustc's output can Xcode 26.6's strip handle?
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.91', '1.92', '1.93', '1.94', '1.95', '1.96', '1.97', '1.98']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build and measure
        working-directory: packages/rust/ios
        run: |
          rustc -vV | grep -E '^(release|LLVM)'
          ./build-xcframework.sh >/dev/null 2>build.err || { echo "PROBE rust=${{ matrix.rust }} BUILD FAILED"; tail -5 build.err; exit 0; }
          size=$(stat -f%z EpaperDithering.xcframework/ios-arm64/libepaper_dithering_ios.a)
          llvm=$(rustc -vV | sed -n 's/^LLVM version: //p')
          echo "PROBE rust=${{ matrix.rust }} llvm=${llvm} device_bytes=${size}"
